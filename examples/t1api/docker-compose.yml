# HyperNix T1 API — production-shaped compose stack.
#
#   cp examples/t1api/.env.example .env
#   # fill in T1_TOKEN_SECRET and POSTGRES_PASSWORD at minimum
#   docker compose -f examples/t1api/docker-compose.yml up -d
#
# Three services: the API, PostgreSQL, and an nginx front end that
# terminates TLS (and mTLS, if you enable it in nginx.conf). The API
# itself listens on the internal network only — it is never published to
# the host, so the proxy is the single entry point rather than one of two.

name: hypernix-t1api

services:
  api:
    build:
      context: ../..
      dockerfile: examples/t1api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      T1_ENVIRONMENT: production
      T1_DATABASE_URL: postgresql://t1:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/t1api
      T1_TOKEN_SECRET: ${T1_TOKEN_SECRET:?set T1_TOKEN_SECRET (python -c 'import secrets;print(secrets.token_hex(32))')}
      T1_DEPLOY_SECRET: ${T1_DEPLOY_SECRET:-}
      T1_MODEL_REGISTRY_PATH: /etc/hypernix/models.json
      T1_ROUTING_POLICY_PATH: /etc/hypernix/routing.json
      T1_MODULE_STORAGE_DIR: /var/lib/hypernix/modules
      # nginx terminates TLS, so the API is told to trust that hop's
      # forwarded headers — and only that hop's.
      T1_MTLS_BEHIND_PROXY: "1"
      T1_TRUSTED_PROXIES: 172.16.0.0/12
      T1_MTLS_REQUIRE_CLIENT_CERT: ${T1_MTLS_REQUIRE_CLIENT_CERT:-0}
      T1_EXPOSE_DOCS: "0"
      T1_CORS_ALLOW_ORIGINS: ${T1_CORS_ALLOW_ORIGINS:-}
    volumes:
      - modules:/var/lib/hypernix/modules
      - ./config:/etc/hypernix:ro
    # Deliberately no `ports:` — reachable only through the proxy.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: t1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: t1api
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API's schema creation runs at startup and will fail against a
      # database that isn't accepting connections yet, so `api` waits on
      # this rather than on the container merely existing.
      test: ["CMD-SHELL", "pg_isready -U t1 -d t1api"]
      interval: 5s
      timeout: 3s
      retries: 10

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro

volumes:
  pgdata:
  modules:
